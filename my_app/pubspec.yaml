name: bayan_sulu_kids
description: "Bayan Sulu Kids - Educational mobile game for children featuring KamBot the camel"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  model_viewer_plus: ^1.8.1
  http: ^1.2.0
  flutter_tts: ^4.2.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/candies/
    - assets/catchgame/
    - assets/coin/
    - assets/cumbot/
    - assets/quiz/
    - assets/store/
    - assets/words/
    - assets/map/
